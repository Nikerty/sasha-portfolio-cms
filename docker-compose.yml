version: '3'

services:
  cms:
    build:
      context: .
    container_name: sk-cms
    working_dir: /app
    restart: unless-stopped
    ports:
      - '4000:4000'
    depends_on:
      - db
    volumes:
      - ./config:/home/developer/sk-cms/config
      - ./src:/home/developer/sk-cms/src
      - ./package.json:/home/developer/sk-cms/package.json
      - ./yarn.lock:/home/developer/sk-cms/yarn.lock
      - ./.env:/home/developer/sk-cms/.env
      - ./public/uploads:/home/developer/sk-cms/public/uploads

  db:
    image: postgres
    command: postgres -c 'max_connections=200'
    container_name: sk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - sk-db-pgdata:/var/lib/postgresql/data

volumes:
  sk-db-pgdata:

